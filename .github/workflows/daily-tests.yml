name: Daily Test Report

on:
  schedule:
    # 03:00 UTC every day — adjust to your timezone/needs
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # needed to push the report to the gh-pages branch

jobs:
  test-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest pytest-html

      - name: Install Allure commandline (report generator)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-2.29.0/bin" >> "$GITHUB_PATH"

      # Pull down yesterday's published report from gh-pages just to grab its
      # history/ folder — that's the one directory Allure reads back in to
      # know what "trend over time" means. Everything else about the old
      # report is thrown away and rebuilt fresh below.
      - name: Restore previous Allure history (for trend graphs)
        run: |
          mkdir -p reports/allure-results/history
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git show origin/gh-pages:history/history.json > /dev/null 2>&1; then
            git archive origin/gh-pages history | tar -x -C reports/allure-results
            echo "Restored previous history."
          else
            echo "No previous gh-pages history found — starting fresh."
          fi

      - name: Run tests (JUnit XML + Allure raw results + single-file HTML)
        run: |
          pytest \
            --junitxml=reports/junit.xml \
            --alluredir=reports/allure-results \
            --html=reports/pytest-report.html --self-contained-html \
            --continue-on-collection-errors \
            || true   # never fail the workflow just because a test failed — we still want the report published

      - name: Build Allure HTML report (the "Spark"-style report, with trend)
        run: allure generate reports/allure-results -o reports/allure-report --clean

      - name: Write run summary (shows directly on the Actions run page)
        run: python scripts/junit_to_summary.py reports/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/allure-report
          keep_files: false

      # Raw XML kept as a downloadable artifact too, in case anything
      # external (a future Grafana/other tool) ever wants to consume it.
      - name: Upload raw JUnit XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-${{ github.run_id }}
          path: reports/junit.xml
          retention-days: 30